# nginx site for the API. Install as /etc/nginx/sites-available/api.test-crm.profitpad.com,
# symlink into sites-enabled, then: sudo certbot --nginx -d api.test-crm.profitpad.com
# The limit_req zones used below live in nginx-pcrm-limits.conf (http context).
server {
    server_name api.test-crm.profitpad.com;
    listen 80;
    client_max_body_size 25M;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_read_timeout 120s;

    # customer-facing quote and form pages (no sign-in)
    location /v1/public/ {
        limit_req zone=pcrm_public burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # sign-in starts and callbacks
    location /v1/auth/ {
        limit_req zone=pcrm_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
