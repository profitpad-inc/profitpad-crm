# nginx in front of ProfitPad installed with PCRM_BEHIND_PROXY=8080
# (install.sh): nginx does HTTPS, Caddy in the web container does the rest
# (UI, API paths, files, rate limits). Replace crm.example.com with your
# address (add more names to server_name to serve the CRM on them too),
# install as /etc/nginx/sites-available/<address>, symlink into
# sites-enabled, then: sudo certbot --nginx -d crm.example.com
server {
    server_name crm.example.com;
    listen 80;
    server_tokens off;

    # uploads arrive in 8 MB chunks; Postmark's inbound replies up to 35 MB
    client_max_body_size 40M;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # live updates (/v1/live/) and the MCP server stream their replies
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
