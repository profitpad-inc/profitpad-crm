# ProfitPad CRM from published images: no clone, no build. Setup and updates:
# install.sh in this folder, or docs/self-hosting.md.
#
#   web       Caddy: HTTPS, the UI, and every API path on the same address
#   api       the API
#   migrate   database roles and migrations; runs on every "up", then exits,
#             and the API waits for it
#   db        Postgres
#   renderer  headless Chromium for custom view previews and quote PDFs
#
# Settings come from .env (addresses, sign-in, keys) and db.env (the Postgres
# superuser password), both next to this file.
#
# Several installs on one server: each in its own folder, with its own
# PCRM_INSTANCE in .env (e.g. demo), which names its containers (pc-demo-api)
# and volumes (pcrm_demo_files). Unset, the names are pc-api and pcrm_files.
# Never change it after the first start: the data stays in the old volumes.
#
# Update: docker compose pull && docker compose up -d
# (always through compose, so migrations run before the new API starts; tools
# that restart containers on their own, such as Watchtower, skip that step)

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: postgres:15
    container_name: pc${PCRM_INSTANCE:+-${PCRM_INSTANCE}}-db
    restart: unless-stopped
    env_file: db.env
    # Docker's default 64 MB /dev/shm is too small for Postgres: VACUUM and
    # parallel queries on large tables fail with "could not resize shared
    # memory segment ... No space left on device"
    shm_size: 1g
    # Memory settings are worked out each time the container starts (README,
    # "Server size"): the server's memory (or the container's limit), split
    # evenly between the ProfitPad installs on the server. Each install's
    # database leaves a file named after its container in
    # /var/lib/profitpad-crm/pg-installs on the host, and the files are
    # counted; after taking an install off the server, take its file out of
    # that folder and restart the others.
    # PCRM_PG_MEMORY_MB in .env plans on that many MB instead (other apps on
    # the server, say); PCRM_PG_SHARED_BUFFERS and the other PCRM_PG_* keys
    # set one value outright. The chosen values are in the container's log.
    entrypoint:
      - bash
      - -c
      - |
        set -eu
        mb=$$(awk '/^MemTotal:/ { print int($$2 / 1024) }' "$${PG_MEMINFO:-/proc/meminfo}")
        lim=$$(cat "$${PG_CGROUP_MAX:-/sys/fs/cgroup/memory.max}" 2>/dev/null || echo max)
        if [ "$$lim" != max ] && [ $$((lim / 1048576)) -lt "$$mb" ]; then mb=$$((lim / 1048576)); fi
        dir=$${PG_INSTALLS_DIR:-/pg-installs}
        mkdir -p "$$dir" && touch "$$dir/$$PCRM_DB_CONTAINER"
        n=$$(( $$(find "$$dir" -maxdepth 1 -type f | wc -l) )); [ "$$n" -ge 1 ] || n=1
        m=$${PCRM_PG_MEMORY_MB:-$$((mb / n))}
        # servers report a little under their size (8 GB shows about 7.8): round
        # up to whole GB, and to an even number from 6 GB
        g=$$(( (m + 1023) / 1024 )); [ "$$g" -ge 1 ] || g=1
        if [ "$$g" -ge 6 ] && [ $$((g % 2)) -eq 1 ]; then g=$$((g + 1)); fi
        m=$$((g * 1024))
        size() { if [ $$(($$1 % 1024)) -eq 0 ]; then echo "$$(($$1 / 1024))GB"; else echo "$${1}MB"; fi; }
        # a quarter of memory for shared buffers (an eighth below 4 GB, where the
        # API and the renderer need most of it), at most 16 GB
        if [ "$$m" -lt 4096 ]; then sb=$$((m / 8)); else sb=$$((m / 4)); fi
        [ "$$sb" -le 16384 ] || sb=16384
        ecs=$$((m * 3 / 4))
        mwm=$$((m / 16)); [ "$$mwm" -ge 64 ] || mwm=64; [ "$$mwm" -le 1024 ] || mwm=1024
        wm=16; [ "$$m" -lt 8192 ] || wm=32; [ "$$m" -lt 32768 ] || wm=64
        sb=$${PCRM_PG_SHARED_BUFFERS:-$$(size $$sb)}
        ecs=$${PCRM_PG_EFFECTIVE_CACHE_SIZE:-$$(size $$ecs)}
        wm=$${PCRM_PG_WORK_MEM:-$${wm}MB}
        mwm=$${PCRM_PG_MAINTENANCE_WORK_MEM:-$$(size $$mwm)}
        rpc=$${PCRM_PG_RANDOM_PAGE_COST:-1.1}
        echo "postgres memory: $${mb} MB server, $$n install(s), planning on $$m MB:" \
          "shared_buffers=$$sb effective_cache_size=$$ecs work_mem=$$wm maintenance_work_mem=$$mwm"
        exec docker-entrypoint.sh postgres -c shared_buffers=$$sb -c effective_cache_size=$$ecs \
          -c work_mem=$$wm -c maintenance_work_mem=$$mwm -c random_page_cost=$$rpc
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: profitpad_crm_db
      PCRM_DB_CONTAINER: pc${PCRM_INSTANCE:+-${PCRM_INSTANCE}}-db
      PCRM_PG_MEMORY_MB: ${PCRM_PG_MEMORY_MB:-}
      PCRM_PG_SHARED_BUFFERS: ${PCRM_PG_SHARED_BUFFERS:-}
      PCRM_PG_EFFECTIVE_CACHE_SIZE: ${PCRM_PG_EFFECTIVE_CACHE_SIZE:-}
      PCRM_PG_WORK_MEM: ${PCRM_PG_WORK_MEM:-}
      PCRM_PG_MAINTENANCE_WORK_MEM: ${PCRM_PG_MAINTENANCE_WORK_MEM:-}
      PCRM_PG_RANDOM_PAGE_COST: ${PCRM_PG_RANDOM_PAGE_COST:-}
    volumes:
      - pc_db_data:/var/lib/postgresql/data
      - /var/lib/profitpad-crm/pg-installs:/pg-installs
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profitpad_crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging

  migrate:
    image: ${PCRM_REGISTRY:-ghcr.io/profitpad-inc}/profitpad-crm-migrate:${PCRM_VERSION:-latest}
    container_name: pc${PCRM_INSTANCE:+-${PCRM_INSTANCE}}-migrate
    restart: "no"
    env_file: db.env
    environment:
      # the API's database password, so its login matches .env
      PCRM_API_PASSWORD: ${PGPASSWORD:?set PGPASSWORD in .env}
    networks:
      - db_net
    depends_on:
      db:
        condition: service_healthy
    logging: *logging

  api:
    image: ${PCRM_REGISTRY:-ghcr.io/profitpad-inc}/profitpad-crm-api:${PCRM_VERSION:-latest}
    container_name: pc${PCRM_INSTANCE:+-${PCRM_INSTANCE}}-api
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: pc_api_login
      PGDATABASE: profitpad_crm_db
      HOST: 0.0.0.0
      PORT: "3100"
      # the UI and the API share one address
      UI_URL: ${PCRM_URL:?set PCRM_URL in .env}
      PUBLIC_API_URL: ${PCRM_URL}
      CORS_ORIGINS: ${CORS_ORIGINS:-${PCRM_URL}}
      TRUST_PROXY: "true"
      # stored files: written here by the API, sent by Caddy from the same
      # volume (X-Accel-Redirect, see the Caddyfile in web/)
      FILES_DIR: /data/files
      FILES_ACCEL_PREFIX: /_pcrm_files/
      RENDERER_WS_URL: ws://renderer:3000/
      VIEW_FRAME_URL: http://web/view-frame/index.html
      PAGE_SHELL_URL: http://web/p/page/index.html
    volumes:
      - ${PCRM_FILES_DIR:-pc_files}:/data/files
    networks:
      - db_net
      - renderer_net
      - web_net
    depends_on:
      migrate:
        condition: service_completed_successfully
      renderer:
        condition: service_started
    logging: *logging

  # Reachable only by the API on renderer_net, which has no way out to the
  # internet; the API also blocks every request the page makes.
  renderer:
    image: ${PCRM_REGISTRY:-ghcr.io/profitpad-inc}/profitpad-crm-renderer:${PCRM_VERSION:-latest}
    container_name: pc${PCRM_INSTANCE:+-${PCRM_INSTANCE}}-renderer
    restart: unless-stopped
    init: true
    # Chromium needs more shared memory than Docker's 64 MB default
    shm_size: 512m
    mem_limit: 1g
    networks:
      - renderer_net
    logging: *logging

  web:
    image: ${PCRM_REGISTRY:-ghcr.io/profitpad-inc}/profitpad-crm-web:${PCRM_VERSION:-latest}
    container_name: pc${PCRM_INSTANCE:+-${PCRM_INSTANCE}}-web
    restart: unless-stopped
    environment:
      # crm.example.com: Caddy gets the HTTPS certificate itself.
      # :80: plain HTTP behind your own reverse proxy (see docs/self-hosting.md)
      PCRM_SITE_ADDRESS: ${PCRM_SITE_ADDRESS:?set PCRM_SITE_ADDRESS in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ${PCRM_FILES_DIR:-pc_files}:/srv/files:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web_net
    depends_on:
      api:
        condition: service_started
    logging: *logging

volumes:
  pc_db_data:
    name: ${PCRM_DB_VOLUME:-pcrm${PCRM_INSTANCE:+_${PCRM_INSTANCE}}_db_data}
  pc_files:
    name: pcrm${PCRM_INSTANCE:+_${PCRM_INSTANCE}}_files
  caddy_data:
    name: pcrm${PCRM_INSTANCE:+_${PCRM_INSTANCE}}_caddy_data
  caddy_config:
    name: pcrm${PCRM_INSTANCE:+_${PCRM_INSTANCE}}_caddy_config

networks:
  db_net:
  web_net:
  renderer_net:
    internal: true
