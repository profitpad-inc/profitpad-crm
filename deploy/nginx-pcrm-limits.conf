# Rate limit zones for the CRM API (http context). Install as
# /etc/nginx/conf.d/pcrm-limits.conf; the API site uses them by name.
# Per visitor IP: public quote/form routes 30 a minute, sign-in routes 20 a minute,
# OAuth (app registration, consent, tokens) 60 a minute: AI services such as
# Claude call the token endpoint for many users from shared addresses.
limit_req_zone $binary_remote_addr zone=pcrm_public:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=pcrm_auth:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=pcrm_oauth:10m rate=60r/m;
