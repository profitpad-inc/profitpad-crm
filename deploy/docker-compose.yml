# The CRM API container. nginx on the host terminates TLS for
# api.test-crm.profitpad.com and forwards to 127.0.0.1:3100.
# Run from this folder: docker compose up -d --build
services:
  api:
    build: ../api
    image: profitpad-crm-api
    container_name: test-crm-api
    restart: unless-stopped
    # PGUSER, PGPASSWORD, PGDATABASE, CORS_ORIGINS, DOCS_PUBLIC, TRUST_PROXY, FILES_URL_KEY
    env_file: .env
    environment:
      PGHOST: postgres          # the postgres container, reached over n8n_net
      PGPORT: "5432"
      HOST: 0.0.0.0
      PORT: "3100"
      # stored files: written here by the API, read by nginx on the host
      # from /srv/test_crm_files (location /_pcrm_files/)
      FILES_DIR: /data/files
      FILES_ACCEL_PREFIX: /_pcrm_files/
      # the headless browser for render_view (the renderer service below)
      RENDERER_WS_URL: ws://test-crm-renderer:3000/
    volumes:
      - /srv/test_crm_files:/data/files
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - n8n_net
      - renderer_net
    depends_on:
      - renderer

  # Headless Chromium that renders custom view drafts for the MCP's
  # render_view. Reachable only by the API on renderer_net, which has no way
  # out to the internet; the API also blocks every request the page makes.
  renderer:
    build: ./renderer
    image: profitpad-crm-renderer
    container_name: test-crm-renderer
    restart: unless-stopped
    init: true
    # Chromium needs more shared memory than Docker's 64 MB default
    shm_size: 512m
    mem_limit: 1g
    networks:
      - renderer_net

networks:
  n8n_net:
    external: true
  renderer_net:
    internal: true
