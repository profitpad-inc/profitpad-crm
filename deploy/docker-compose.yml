# The CRM's containers: Postgres, the API, and the headless renderer.
# nginx on the host terminates TLS for api.crm.profitpad.com and forwards
# to 127.0.0.1:3100.
# Run from this folder: docker compose up -d --build
services:
  # The CRM's own Postgres (moved out of the n8n container). Data lives in the
  # pc_db_data volume, so rebuilding or restarting the API never touches it.
  # Published on 127.0.0.1:5434 only: the SSH tunnel reaches it from the Mac,
  # nothing outside the server can. The superuser ("postgres") password lives
  # in db.env in this folder (POSTGRES_PASSWORD=..., chmod 600, gitignored),
  # which only this container reads, so the API never sees it. The image only
  # uses it when it creates an empty data folder; changing it later does not
  # change the password (use ALTER ROLE postgres PASSWORD for that).
  db:
    image: postgres:15
    container_name: pc-db
    restart: unless-stopped
    env_file: db.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: profitpad_crm_db
    volumes:
      - pc_db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5434:5432"
    networks:
      - db_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d profitpad_crm_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../api
    image: profitpad-crm-api
    container_name: pc-api
    restart: unless-stopped
    # PGUSER, PGPASSWORD, PGDATABASE, CORS_ORIGINS, DOCS_PUBLIC, TRUST_PROXY, FILES_URL_KEY
    env_file: .env
    environment:
      PGHOST: db                # the db service above, reached over db_net
      PGPORT: "5432"
      HOST: 0.0.0.0
      PORT: "3100"
      # stored files: written here by the API, read by nginx on the host
      # from /srv/profitpad_crm_files (location /_pcrm_files/)
      FILES_DIR: /data/files
      FILES_ACCEL_PREFIX: /_pcrm_files/
      # the headless browser for render_view (the renderer service below)
      RENDERER_WS_URL: ws://pc-renderer:3000/
    volumes:
      - /srv/profitpad_crm_files:/data/files
    ports:
      - "127.0.0.1:3100:3100"
    networks:
      - db_net
      - renderer_net
      # n8n's network: integrations may call n8n directly
      # (INTEGRATION_PRIVATE_HOSTS=n8n). Not used for the database any more.
      - n8n_net
    depends_on:
      db:
        condition: service_healthy
      renderer:
        condition: service_started

  # Headless Chromium that renders custom view drafts for the MCP's
  # render_view. Reachable only by the API on renderer_net, which has no way
  # out to the internet; the API also blocks every request the page makes.
  renderer:
    build: ./renderer
    image: profitpad-crm-renderer
    container_name: pc-renderer
    restart: unless-stopped
    init: true
    # Chromium needs more shared memory than Docker's 64 MB default
    shm_size: 512m
    mem_limit: 1g
    networks:
      - renderer_net

volumes:
  pc_db_data:

networks:
  db_net:
  n8n_net:
    external: true
  renderer_net:
    internal: true
