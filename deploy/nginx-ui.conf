# nginx site for the UI, served from this server (docs/self-hosting.md).
# Replace crm.example.com with your UI address and /srv/profitpad_crm with
# where the repo lives, install as /etc/nginx/sites-available/<that address>,
# symlink into sites-enabled, then: sudo certbot --nginx -d crm.example.com
# The files come from "docker compose run --rm web-build" (web/dist).
server {
    server_name crm.example.com;
    listen 80;
    server_tokens off;
    root /srv/profitpad_crm/web/dist;

    # HTML is checked on every load so a new build shows up at once; the
    # hashed files under /assets/ never change and can be cached for a year.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # Public pages (/p/quote/, /p/form/, /p/book/, /p/invoice/) are folders
    # with their own index.html; every other path is the app, which routes
    # in the browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
