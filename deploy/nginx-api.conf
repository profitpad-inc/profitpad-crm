# nginx site for the API (docs/self-hosting.md). Replace api.crm.example.com with your API address,
# install as /etc/nginx/sites-available/<that address>,
# symlink into sites-enabled, then: sudo certbot --nginx -d api.crm.example.com
# The limit_req zones used below live in nginx-pcrm-limits.conf (http context).
server {
    server_name api.crm.example.com;
    listen 80;
    client_max_body_size 25M;
    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    proxy_read_timeout 120s;

    # customer-facing quote and form pages (no sign-in)
    location /v1/public/ {
        limit_req zone=pcrm_public burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # sign-in starts and callbacks
    location /v1/auth/ {
        limit_req zone=pcrm_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth for connected apps: registration, consent page, tokens
    location /oauth/ {
        limit_req zone=pcrm_oauth burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP server: replies may stream (SSE), so no buffering
    location = /mcp {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Live updates on record pages (api/src/live.ts): Server-Sent Events, so no
    # buffering. The API pings every 25 s and ends each stream after about 10
    # minutes (the browser reconnects), so an hour is only a ceiling.
    location /v1/live/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stored files (api/src/files.ts). Signed links (/v1/files/<id>/raw) and
    # public links (/files/<key>/<name>) go to the API, which checks access
    # and answers with X-Accel-Redirect: /_pcrm_files/<storage key>; nginx
    # then sends the bytes from disk (sendfile, range requests). Files opened
    # twice within 10 minutes keep their descriptors in the open file cache;
    # their bytes stay in the OS page cache while memory allows. nginx is
    # expected to keep the API's Content-Type, Content-Disposition and
    # Cache-Control on an X-Accel-Redirect but not other headers (not yet
    # confirmed, see docs/deploy.md section 9), so the CSP (strict for media
    # that opens, sandbox for downloads; an uploaded HTML or SVG file must
    # never run scripts on this domain) is copied from the API's response.
    location /_pcrm_files/ {
        internal;
        alias /srv/profitpad_crm_files/;
        sendfile on;
        tcp_nopush on;
        open_file_cache max=10000 inactive=10m;
        open_file_cache_valid 60s;
        open_file_cache_min_uses 2;
        open_file_cache_errors off;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy $upstream_http_content_security_policy always;
        add_header X-Frame-Options DENY always;
    }

    # Upload chunks (8 MB each) stream straight through to the API.
    location ~ "^/v1/files/[0-9a-f]{10}/content$" {
        client_max_body_size 9M;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
