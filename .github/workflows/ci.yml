# Checks every push and pull request: the API typechecks, the UI builds, and
# neither ships a dependency with a known high or critical vulnerability
# (scripts/ci/audit.mjs: advisories in .github/audit-allowlist.json, each with
# a reason and a review date, only warn).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Audit production dependencies
        run: node ../scripts/ci/audit.mjs --omit=dev

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Audit dependencies
        run: node ../scripts/ci/audit.mjs
